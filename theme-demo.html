<!DOCTYPE html>
<html lang="en" class="h-full" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Toggle Demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // This script prevents flash of wrong theme on page load
        (function() {
            const theme = localStorage.getItem('theme') || 'system';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            let shouldBeDark = false;
            if (theme === 'dark') {
                shouldBeDark = true;
            } else if (theme === 'light') {
                shouldBeDark = false;
            } else {
                shouldBeDark = prefersDark;
            }
            
            if (shouldBeDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>
    <style>
        @supports (color: oklch(0 0 0)) {
            :root {
                color-scheme: light;
            }
            :root.dark {
                color-scheme: dark;
            }
        }
    </style>
</head>
<body class="bg-white dark:bg-zinc-950 text-zinc-950 dark:text-zinc-50 h-full flex flex-col transition-colors">
    <div class="flex-1 flex items-center justify-center">
        <div class="max-w-md w-full mx-auto p-8">
            <div class="bg-zinc-100 dark:bg-zinc-900 rounded-lg p-8 shadow-lg">
                <h1 class="text-3xl font-bold mb-2">Theme Toggle Demo</h1>
                <p class="text-zinc-600 dark:text-zinc-400 mb-8">
                    Click the buttons below to switch between light, system, and dark themes. Your preference is saved automatically.
                </p>

                <div class="space-y-6">
                    <div>
                        <h2 class="text-lg font-semibold mb-4">Current Theme</h2>
                        <p class="text-sm text-zinc-600 dark:text-zinc-400">
                            Theme: <span id="theme-display" class="font-mono font-bold text-zinc-900 dark:text-zinc-50">system</span>
                        </p>
                        <p class="text-sm text-zinc-600 dark:text-zinc-400 mt-2">
                            Resolved: <span id="resolved-theme" class="font-mono font-bold text-zinc-900 dark:text-zinc-50">light</span>
                        </p>
                    </div>

                    <div>
                        <h2 class="text-lg font-semibold mb-4">Theme Options</h2>
                        <div class="flex items-center gap-1 rounded-lg border border-zinc-300 dark:border-zinc-600 bg-zinc-100 dark:bg-zinc-800 p-1">
                            <button
                                onclick="setTheme('light')"
                                class="theme-btn px-4 py-2 rounded text-sm font-medium transition-all duration-200"
                                id="btn-light"
                                title="Light mode"
                            >
                                ☀️ Light
                            </button>
                            <button
                                onclick="setTheme('system')"
                                class="theme-btn px-4 py-2 rounded text-sm font-medium transition-all duration-200"
                                id="btn-system"
                                title="System preference"
                            >
                                🖥️ System
                            </button>
                            <button
                                onclick="setTheme('dark')"
                                class="theme-btn px-4 py-2 rounded text-sm font-medium transition-all duration-200"
                                id="btn-dark"
                                title="Dark mode"
                            >
                                🌙 Dark
                            </button>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-zinc-300 dark:border-zinc-700">
                        <p class="text-xs text-zinc-600 dark:text-zinc-400">
                            💾 Your preference is automatically saved to localStorage
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function setTheme(newTheme) {
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        function applyTheme(theme) {
            const html = document.documentElement;
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            let shouldBeDark = false;
            if (theme === 'dark') {
                shouldBeDark = true;
            } else if (theme === 'light') {
                shouldBeDark = false;
            } else {
                shouldBeDark = prefersDark;
            }
            
            if (shouldBeDark) {
                html.classList.add('dark');
            } else {
                html.classList.remove('dark');
            }
            
            updateDisplay(theme, shouldBeDark);
        }

        function updateDisplay(theme, isDark) {
            document.getElementById('theme-display').textContent = theme;
            document.getElementById('resolved-theme').textContent = isDark ? 'dark' : 'light';
            
            // Update button states
            ['light', 'system', 'dark'].forEach(t => {
                const btn = document.getElementById(`btn-${t}`);
                if (t === theme) {
                    btn.classList.add('bg-white', 'dark:bg-zinc-700', 'text-zinc-900', 'dark:text-zinc-50', 'shadow');
                    btn.classList.remove('text-zinc-600', 'dark:text-zinc-400', 'hover:text-zinc-900', 'dark:hover:text-zinc-50');
                } else {
                    btn.classList.remove('bg-white', 'dark:bg-zinc-700', 'text-zinc-900', 'dark:text-zinc-50', 'shadow');
                    btn.classList.add('text-zinc-600', 'dark:text-zinc-400', 'hover:text-zinc-900', 'dark:hover:text-zinc-50');
                }
            });
        }

        // Initialize on page load
        function initializeTheme() {
            const theme = localStorage.getItem('theme') || 'system';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = theme === 'dark' || (theme === 'system' && prefersDark);
            updateDisplay(theme, isDark);
        }

        // Listen for system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            const theme = localStorage.getItem('theme') || 'system';
            if (theme === 'system') {
                applyTheme('system');
            }
        });

        initializeTheme();
    </script>
</body>
</html>
